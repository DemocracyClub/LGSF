[project]
name = "lgsf"
version = "0.0.0"
description = "The Local Government Scraper Framework is a set of tools for scraping UK local government websites"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "beautifulsoup4==4.13.4",
    "cryptography==50.0.0",
    "html5lib>=1.1",
    "httpx==0.28.1",
    "lxml==6.1.0",
    "playwright>=1.60.0",
    "pyjwt==2.14.0",
    "python-dateutil==2.9.0.post0",
    "python-slugify==8.0.4",
    "requests[security]==2.33.0",
    "retry2==0.9.5",
    "rich==14.0.0",
    "wreq==0.11.3",
]

[dependency-groups]
dev = [
    "ipdb==0.13.13",
    "pre-commit==4.2.0",
    "pystache==0.6.8",
    "pytest==9.0.3",
    "pytest-blockage==0.2.4",
    "pytest-mypy-plugins==3.2.0",
    "pytest-ruff==0.5",
    "ruff==0.15.22",
]
cdk = [
    "aws-cdk-lib>=2.253.0,<3.0.0",
    "constructs>=10.5.0,<11.0.0",
    "aws-cdk-aws-lambda-python-alpha>=2.253.0,<3.0.0",
]
embeddings = [
    "boto3==1.43.109",
    "psycopg[binary]==3.3.6",
    "sentence-transformers==6.1.0",
    "torch==2.14.1",
]

[tool.uv]
package = false
required-version = "==0.11.*"

# torch from PyPI is the CUDA build on Linux, which brings several GB of
# NVIDIA libraries. Embeddings run on CPU, so take torch from PyTorch's
# CPU-only index instead.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
testpaths = ["lgsf", "scrapers"]
norecursedirs = ["cdk.out", "node_modules", ".venv", ".git"]
