[project]
name = "lgsf"
version = "0.0.0"
description = "The Local Government Scraper Framework is a set of tools for scraping UK local government websites"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "beautifulsoup4==4.13.4",
    "boto3==1.43.108",
    "cryptography==50.0.0",
    "html5lib>=1.1",
    "httpx==0.28.1",
    "lxml==6.1.0",
    "olefile==0.47",
    "playwright>=1.60.0",
    "pyjwt==2.15.0",
    "python-dateutil==2.9.0.post0",
    "python-slugify==8.0.4",
    "requests[security]==2.34.2",
    "retry2==0.9.5",
    "rich==14.0.0",
    "wreq==0.11.3",
]

[dependency-groups]
dev = [
    "git-filter-repo>=2.47.0",
    "ipdb==0.13.13",
    "pre-commit==4.2.0",
    "pystache==0.6.8",
    "pytest==9.0.3",
    "pytest-blockage==0.2.4",
    "pytest-mypy-plugins==3.2.0",
    "pytest-ruff==0.5",
    "ruff==0.15.22",
    "jsonschema==4.26.0",
]
cdk = [
    "aws-cdk-lib>=2.253.0,<3.0.0",
    "constructs>=10.5.0,<11.0.0",
    "aws-cdk-aws-lambda-python-alpha>=2.253.0,<3.0.0",
]
# The document pipeline's extraction (lgsf/embeddings/, docs/document-pipeline.md).
# Kept out of the main dependencies: the Lambda layer is built from
# `uv export --no-dev` and has to stay under 250MB, and Docling with torch
# is several times that. Everything in lgsf/embeddings/ except extraction
# imports without this group.
embeddings = [
    "docling==2.142.0",
    "docling-core==2.104.0",
    "docling-parse==7.22.4",
    "rapidocr==3.9.2",
    "torch==2.14.1",
    "torchvision==0.29.1",
]

[tool.uv]
package = false
required-version = "==0.11.*"

[tool.uv.sources]
# torch from PyPI is the CUDA build on Linux, which brings several GB of
# NVIDIA libraries. The embeddings group runs on CPU, so it takes torch
# from PyTorch's CPU-only index instead. torchvision, which Docling
# needs, has to come from the same index, to be built against the same
# torch.
torch = [{ index = "pytorch-cpu", group = "embeddings" }]
torchvision = [{ index = "pytorch-cpu", group = "embeddings" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["lgsf", "scrapers", "scripts"]
norecursedirs = ["cdk.out", "node_modules", ".venv", ".git"]
