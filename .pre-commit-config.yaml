repos:
-   repo: local
    hooks:
    -   id: code-check
        name: code-check
        entry: scripts/code-check.sh
        language: system
        types: [python]
        pass_filenames: false
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.0.1
    hooks:
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: check-json
